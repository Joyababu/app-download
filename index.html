<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Download Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 30px auto;
        }
        .grid-item {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .grid-item:hover {
            transform: translateY(-5px);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Download Our Official App</h1>
    <p>Click any of the images below to download the APK file.</p>

    <div class="grid-container">
        <!-- Button 1 -->
        <div class="grid-item">
            <a href="https://github.com/Joyababu/app-download/releases/download/v1.0/app.apk">
                <img src="https://via.placeholder.com/200?text=Download+V1" alt="Download Button 1">
            </a>
        </div>
        <!-- Button 2 -->
        <div class="grid-item">
            <a href="https://github.com/Joyababu/app-download/releases/download/v1.0/app.apk">
                <img src="https://via.placeholder.com/200?text=Download+V2" alt="Download Button 2">
            </a>
        </div>
        <!-- Button 3 -->
        <div class="grid-item">
            <a href="https://github.com/Joyababu/app-download/releases/download/v1.0/app.apk">
                <img src="https://via.placeholder.com/200?text=Download+V3" alt="Download Button 3">
            </a>
        </div>
        <!-- Button 4 -->
        <div class="grid-item">
            <a href="https://github.com/Joyababu/app-download/releases/download/v1.0/app.apk">
                <img src="https://via.placeholder.com/200?text=Download+V4" alt="Download Button 4">
            </a>
        </div>
    </div>

</body>
</html>
